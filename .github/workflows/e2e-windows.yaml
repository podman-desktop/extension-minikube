name: e2e-main-windows

on:
  schedule:
    - cron: '30 0 * * *'

  workflow_dispatch:
    inputs:
      fork:
        default: 'podman-desktop'
        description: 'Podman Desktop repo fork'
        type: string
        required: true
      branch:
        default: 'main'
        description: 'Podman Desktop repo branch'
        type: string
        required: true
      ext_repo_options:
        default: 'REPO=extension-minikube,FORK=podman-desktop,BRANCH=main'
        description: 'Podman Desktop Extension repo, fork and branch'
        type: string
        required: true
      ext_tests:
        default: '1'
        description: 'Run E2E tests from extension'
        type: string
        required: true
      npm_target:
        default: 'test:e2e'
        description: 'The npm target to run tests. Use "test:e2e:all" to run all test suites, including Kubernetes tests.'
        type: string
        required: true
      podman_version:
        default: 'latest'
        description: 'Podman version (use "latest" for the latest stable release, or specify a version or installer URL)'
        type: string
        required: false
      podman_options:
        default: 'INIT=1,START=1,ROOTFUL=1,NETWORKING=0'
        description: 'Podman machine configuration options, no spaces'
        type: 'string'
        required: true
      env_vars:
        default: 'TEST_PODMAN_MACHINE=true,EXTENSION_IMAGE="ghcr.io/podman-desktop/podman-desktop-extension-minikube:nightly"'
        description: 'Env. Variables passed into target machine, ie: VAR1=xxx,VAR2=true,VAR3=15,VAR4="Pass me along"'
        type: 'string'
        required: true
      podman_provider:
        default: 'wsl'
        description: 'Podman virtualization provider'
        type: 'string'
        required: true
      e2e_runner_version:
        description: 'e2e-runner image tag. Empty uses the E2E_RUNNER_VERSION repository variable.'
        type: string
        required: false
      mapt_params:
        description: 'Optional MAPT overrides: IMAGE=...;VERSION_TAG=...;CPUS=...;MEMORY=...;EXCLUDED_REGIONS=...'
        type: string
        required: false

jobs:
  windows:
    name: windows-${{ matrix.windows-version }}-${{ matrix.windows-featurepack }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
    env:
      MAPT_IMAGE: ${{ vars.MAPT_IMAGE || 'quay.io/redhat-developer/mapt' }}
      MAPT_VERSION_TAG: ${{ vars.MAPT_VERSION_TAG || 'v0.14.5' }}
      MAPT_CPUS: ${{ vars.MAPT_CPUS || '8' }}
      MAPT_MEMORY: ${{ vars.MAPT_MEMORY || '16' }}
      MAPT_EXCLUDED_REGIONS: ${{ vars.MAPT_EXCLUDED_REGIONS || 'southafricawest,australiacentral2,switzerlandwest' }}
      E2E_RUNNER_VERSION: ${{ inputs.e2e_runner_version || vars.E2E_RUNNER_VERSION || 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        windows-version: ['10','11']
        windows-featurepack: ['22h2-ent', '24h2-ent']
        exclude:
        - windows-version: '10'
          windows-featurepack: '24h2-ent'
        - windows-version: '11'
          windows-featurepack: '22h2-ent'


    steps:
    - name: Resolve Podman Windows installer
      id: fetch-podman
      uses: redhat-actions/podman-install/.github/actions/fetch-latest-podman-version-windows@5b0fb16319979de14e2c7c2c1cc27c98f107ae52
      with:
        version_input: ${{ inputs.podman_version || 'latest' }}
        file_type: msi
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set the default env. variables
      env:
        INPUT_FORK: ${{ inputs.fork || 'podman-desktop' }}
        INPUT_BRANCH: ${{ inputs.branch || 'main' }}
        INPUT_EXT_TESTS: ${{ inputs.ext_tests || '1' }}
        INPUT_NPM_TARGET: ${{ inputs.npm_target || 'test:e2e' }}
        INPUT_ENV_VARS: ${{ inputs.env_vars || 'TEST_PODMAN_MACHINE=false,EXTENSION_IMAGE="ghcr.io/podman-desktop/podman-desktop-extension-minikube:nightly"' }}
        INPUT_PODMAN_OPTIONS: ${{ inputs.podman_options || 'INIT=1,START=1,ROOTFUL=1,NETWORKING=0' }}
        INPUT_PODMAN_PROVIDER: ${{ inputs.podman_provider || 'wsl' }}
        INPUT_EXT_REPO_OPTIONS: ${{ inputs.ext_repo_options || 'REPO=extension-minikube,FORK=podman-desktop,BRANCH=main' }}
        MAPT_PARAMS: ${{ inputs.mapt_params }}
      run: |
        set -euo pipefail
        {
          printf 'FORK=%s\n' "$INPUT_FORK"
          printf 'BRANCH=%s\n' "$INPUT_BRANCH"
          printf 'EXT_TESTS=%s\n' "$INPUT_EXT_TESTS"
          printf 'NPM_TARGET=%s\n' "$INPUT_NPM_TARGET"
          printf 'ENV_VARS=%s\n' "$INPUT_ENV_VARS"
          printf 'PODMAN_PROVIDER=%s\n' "$INPUT_PODMAN_PROVIDER"
        } >> "$GITHUB_ENV"

        IFS=',' read -r -a podman_options <<< "$INPUT_PODMAN_OPTIONS"
        for option in "${podman_options[@]}"; do
          [[ "$option" == *=* ]] || { echo "::error::Invalid Podman option: $option"; exit 1; }
          key="${option%%=*}"
          value="${option#*=}"
          case "$key" in INIT|START|ROOTFUL|NETWORKING) ;; *) echo "::error::Unknown Podman option: $key"; exit 1 ;; esac
          [[ "$value" =~ ^[01]$ ]] || { echo "::error::Invalid Podman option value: $option"; exit 1; }
          printf 'PODMAN_%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
        done

        IFS=',' read -r -a extension_options <<< "$INPUT_EXT_REPO_OPTIONS"
        for option in "${extension_options[@]}"; do
          [[ "$option" == *=* ]] || { echo "::error::Invalid extension option: $option"; exit 1; }
          key="${option%%=*}"
          value="${option#*=}"
          case "$key" in REPO|FORK|BRANCH) ;; *) echo "::error::Unknown extension option: $key"; exit 1 ;; esac
          [[ "$value" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid extension option value: $option"; exit 1; }
          printf 'EXT_%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
        done

        mapt_image="$MAPT_IMAGE"
        mapt_version="$MAPT_VERSION_TAG"
        mapt_cpus="$MAPT_CPUS"
        mapt_memory="$MAPT_MEMORY"
        mapt_excluded_regions="$MAPT_EXCLUDED_REGIONS"
        if [[ -n "$MAPT_PARAMS" ]]; then
          IFS=';' read -r -a mapt_options <<< "$MAPT_PARAMS"
          for option in "${mapt_options[@]}"; do
            [[ "$option" == *=* ]] || { echo "::error::Invalid MAPT option: $option"; exit 1; }
            key="${option%%=*}"
            value="${option#*=}"
            case "$key" in
              IMAGE) mapt_image="$value" ;;
              VERSION_TAG) mapt_version="$value" ;;
              CPUS) mapt_cpus="$value" ;;
              MEMORY) mapt_memory="$value" ;;
              EXCLUDED_REGIONS) mapt_excluded_regions="$value" ;;
              *) echo "::error::Unknown MAPT option: $key"; exit 1 ;;
            esac
          done
        fi
        [[ "$mapt_image" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]] || { echo "::error::Invalid MAPT image"; exit 1; }
        [[ "$mapt_version" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "::error::Invalid MAPT version"; exit 1; }
        [[ "$mapt_cpus" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid MAPT CPU count"; exit 1; }
        [[ "$mapt_memory" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid MAPT memory"; exit 1; }
        [[ "$mapt_excluded_regions" =~ ^[a-z0-9,-]+$ ]] || { echo "::error::Invalid MAPT excluded regions"; exit 1; }
        {
          printf 'MAPT_IMAGE=%s\n' "$mapt_image"
          printf 'MAPT_VERSION_TAG=%s\n' "$mapt_version"
          printf 'MAPT_CPUS=%s\n' "$mapt_cpus"
          printf 'MAPT_MEMORY=%s\n' "$mapt_memory"
          printf 'MAPT_EXCLUDED_REGIONS=%s\n' "$mapt_excluded_regions"
        } >> "$GITHUB_ENV"

    - name: Create instance
      id: create
      uses: podman-desktop/e2e/.github/actions/create-instance@main
      with:
        mapt-image: ${{ env.MAPT_IMAGE }}
        mapt-version: ${{ env.MAPT_VERSION_TAG }}
        windows-version: ${{ matrix.windows-version }}
        windows-featurepack: ${{ matrix.windows-featurepack }}
        cpus: ${{ env.MAPT_CPUS }}
        memory: ${{ env.MAPT_MEMORY }}
        excluded-regions: ${{ env.MAPT_EXCLUDED_REGIONS }}
        project-name: windows-desktop
        backed-url: file:///workspace
        tags: project=podman-desktop,source=github,org=${{ github.repository_owner }},run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}
        arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
        arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

    - name: Check instance system info
      uses: podman-desktop/e2e/.github/actions/instance-system-info@main

    - name: Emulate X session
      uses: podman-desktop/e2e/.github/actions/emulate-x-session@main

    - name: Build Podman Desktop
      uses: podman-desktop/e2e/.github/actions/build-podman-desktop@main
      with:
        fork: ${{ env.FORK }}
        branch: ${{ env.BRANCH }}
        env-vars: ${{ env.ENV_VARS }}

    - name: Run Minikube Extension Playwright E2E tests
      id: tests
      uses: podman-desktop/e2e/.github/actions/run-playwright-test@main
      with:
        runner-image: ghcr.io/podman-desktop/e2e-runner
        e2e-runner-tag: ${{ env.E2E_RUNNER_VERSION }}
        target-folder: pd-e2e
        results-folder: results
        podman-download-url: ${{ steps.fetch-podman.outputs.download_url }}
        podman-desktop-path: true
        fork-repo: ${{ env.FORK }}
        branch-name: ${{ env.BRANCH }}
        npm-target: ${{ env.NPM_TARGET }}
        podman-provider: ${{ env.PODMAN_PROVIDER }}
        podman-init: ${{ env.PODMAN_INIT }}
        podman-start: ${{ env.PODMAN_START }}
        rootful: ${{ env.PODMAN_ROOTFUL }}
        user-networking: ${{ env.PODMAN_NETWORKING }}
        ext-repo: ${{ env.EXT_REPO }}
        ext-fork: ${{ env.EXT_FORK }}
        ext-branch: ${{ env.EXT_BRANCH }}
        ext-tests: ${{ env.EXT_TESTS }}
        env-vars: ${{ env.ENV_VARS }}
        ci-bot-token: ${{ secrets.PODMANDESKTOP_CI_BOT_TOKEN }}

    - name: Destroy instance
      if: ${{ always() && (steps.create.outcome == 'success' || steps.create.outcome == 'failure' || steps.create.outcome == 'cancelled') }}
      uses: podman-desktop/e2e/.github/actions/destroy-instance@main
      with:
        mapt-image: ${{ env.MAPT_IMAGE }}
        mapt-version: ${{ env.MAPT_VERSION_TAG }}
        project-name: windows-desktop
        backed-url: file:///workspace
        arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}
        arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
        arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

    - name: Verify JUnit results
      if: ${{ always() && steps.tests.outcome == 'success' && hashFiles('**/*results.xml') == '' }}
      run: |
        echo "::error::The test runner succeeded without producing a JUnit report"
        exit 1

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
      if: ${{ always() && hashFiles('**/*results.xml') != '' }}
      with:
        fail_on_failure: true
        include_passed: true
        detailed_summary: true
        require_tests: true
        annotate_only: true
        report_paths: '**/*results.xml'

    - name: Upload test artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: results-e2e-${{ matrix.windows-version }}${{ matrix.windows-featurepack }}
        path: results/*
        if-no-files-found: ignore
